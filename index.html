<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fox Dash Platformer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow bg-glow-a"></div>
  <div class="bg-glow bg-glow-b"></div>

  <header id="topBar" aria-label="Game HUD">
    <div class="brand">
      <span class="dot"></span>
      <span>Fox Dash</span>
    </div>

    <div class="hint">Move: ← → / Jump: ↑</div>
  </header>

  <main class="stage">
    <canvas id="gameCanvas"></canvas>
  </main>

  <div id="winOverlay" aria-live="polite">
    <div class="win-box">
      <h1>YOU WIN</h1>
      <p>Nice run. All coins collected.</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
