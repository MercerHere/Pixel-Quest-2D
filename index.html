<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>🐍 Jeu Snake Classique</h1>
    
    <div class="game-container">
        <div class="score-board">
            <span>Score: <span id="score">0</span></span>
            <span>Meilleur: <span id="highScore">0</span></span>
        </div>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div class="snake-preview">
            <span id="snakeFace">🐍</span>
        </div>
        
        <div class="controls">
            <button id="startBtn">▶️ Démarrer</button>
            <button id="colorBtn">🎨 Changer Couleur</button>
            <button id="resetBtn">🔄 Réinitialiser</button>
        </div>
    </div>
    
    <div class="instructions">
        <p>Utilisez les flèches ⬆️⬇️⬅️➡️ pour déplacer le serpent</p>
    </div>
        <script src="façon.js"></script>
</body>
</html>
